[build-system]
requires = ["setuptools>=65.5.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nhl-player-cards"
version = "0.1.0"
description = "NHL Player Stat Card generation project"
authors = [{ name = "Avery Doiron" }]
requires-python = ">=3.9"
dependencies = [
    "CairoSVG>=2.8.2",
    "matplotlib>=3.10.7",
    "numpy>=2.3.5",
    "pandas>=2.3.3",
    "pillow>=12.0.0",
    "requests>=2.32.5",
]

[tool.setuptools.packages.find]
where = ["src"]